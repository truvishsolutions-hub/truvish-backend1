# =========================================================
# APPLICATION
# =========================================================

spring.application.name=truvish-corporate-backend


# =========================================================
# SERVER
# =========================================================

server.port=${PORT:8080}


# =========================================================
# HOT POSTGRESQL DATABASE
# =========================================================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/truvish_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# DEFAULT JPA
# =========================================================

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.generate_statistics=true


# =========================================================
# HOT HIKARI CONNECTION POOL
# =========================================================

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# COLD POSTGRESQL DATABASE
# =========================================================

cold.datasource.url=${COLD_DB_URL:jdbc:postgresql://localhost:5432/truvish_cold_db}
cold.datasource.username=${COLD_DB_USERNAME:${DB_USERNAME:postgres}}
cold.datasource.password=${COLD_DB_PASSWORD:${DB_PASSWORD}}
cold.datasource.driver-class-name=org.postgresql.Driver


# =========================================================
# COLD DATABASE JPA / HIBERNATE
# =========================================================

cold.jpa.hibernate.ddl-auto=update
cold.jpa.show-sql=true

cold.jpa.properties.hibernate.format_sql=true
cold.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true


# =========================================================
# COLD HIKARI CONNECTION POOL
# =========================================================

cold.datasource.hikari.maximum-pool-size=5
cold.datasource.hikari.minimum-idle=1
cold.datasource.hikari.idle-timeout=30000
cold.datasource.hikari.connection-timeout=20000
cold.datasource.hikari.max-lifetime=1800000


# =========================================================
# SPRING BOOT ACTUATOR
# =========================================================

management.endpoints.web.exposure.include=health,info,metrics,prometheus

management.endpoint.metrics.access=unrestricted

management.endpoint.health.show-details=always

management.info.env.enabled=true


# =========================================================
# FILE UPLOAD
# =========================================================

spring.servlet.multipart.enabled=true

spring.servlet.multipart.max-file-size=50MB

spring.servlet.multipart.max-request-size=200MB


# =========================================================
# TOMCAT REQUEST LIMIT
# =========================================================

server.tomcat.max-http-post-size=200MB

server.tomcat.max-swallow-size=200MB

server.tomcat.max-parameter-count=20000


# =========================================================
# APPLICATION URLS
# =========================================================

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

app.backend.url=${BACKEND_URL:http://localhost:8080}


# =========================================================
# JWT
# =========================================================

jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION:86400000}


# =========================================================
# RESEND
# =========================================================

resend.api.key=${RESEND_API_KEY}


# =========================================================
# MAIL
# =========================================================

app.mail.sender-name=TruVish

app.mail.sender-email=noreply@truvish.com

app.mail.receiver=truvishsolutions@gmail.com


# =========================================================
# LOGGING
# =========================================================

logging.level.org.springframework=INFO

logging.level.org.springframework.security=DEBUG

logging.level.root=INFO


# =========================================================
# HIBERNATE SQL LOGGING
# =========================================================

logging.level.org.hibernate.SQL=DEBUG

logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.hibernate.stat=DEBUG


# =========================================================
# ERROR HANDLING
# =========================================================

server.error.include-message=always

server.error.include-binding-errors=always


# =========================================================
# UTF-8
# =========================================================

server.servlet.encoding.charset=UTF-8

server.servlet.encoding.enabled=true

server.servlet.encoding.force=true