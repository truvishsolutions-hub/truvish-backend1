# =========================================================
# APPLICATION
# =========================================================
spring.application.name=truvish-backend

# =========================================================
# SERVER
# =========================================================
server.port=${PORT:8080}

# =========================================================
# DATABASE - RAILWAY POSTGRESQL
# =========================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================
# JPA / HIBERNATE
# =========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# =========================================================
# CONNECTION POOL
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# =========================================================
# FILE UPLOAD
# =========================================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=200MB

server.tomcat.max-http-post-size=200MB
server.tomcat.max-swallow-size=200MB
server.tomcat.max-parameter-count=20000

# =========================================================
# URLS
# =========================================================
app.frontend.url=${FRONTEND_URL:https://client.truvish.com}
app.backend.url=${BACKEND_URL:https://api.truvish.com}

# =========================================================
# JWT
# =========================================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# =========================================================
# RESEND
# =========================================================
resend.api.key=${RESEND_API_KEY}

# =========================================================
# MAIL
# =========================================================
app.mail.sender-name=TruVish
app.mail.sender-email=noreply@truvish.com
app.mail.receiver=${MAIL_RECEIVER:truvishsolutions@gmail.com}

# =========================================================
# LOGGING
# =========================================================
logging.level.org.springframework=INFO
logging.level.root=INFO

# =========================================================
# ERROR HANDLING
# =========================================================
server.error.include-message=always
server.error.include-binding-errors=always

# =========================================================
# UTF-8
# =========================================================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
